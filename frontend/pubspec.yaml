name: routestack_frontend
description: A minimal Flutter frontend for RouteStack
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.0
  uuid: ^3.0.6
  provider: ^6.0.5
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  url_launcher: ^6.1.0
  flutter_svg: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
